<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random HTML</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #1e293b;
        --card: #0b1220cc;
        --text: #e2e8f0;
        --accent: #22d3ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at 20% 20%, #334155 0%, transparent 40%),
          radial-gradient(circle at 80% 80%, #155e75 0%, transparent 35%),
          linear-gradient(135deg, var(--bg1), var(--bg2));
      }

      .card {
        width: min(680px, 92vw);
        padding: 2rem;
        border-radius: 18px;
        background: var(--card);
        backdrop-filter: blur(8px);
        box-shadow: 0 12px 30px #00000040;
        border: 1px solid #334155;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }

      p {
        line-height: 1.6;
      }

      .badge {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: #083344;
        color: var(--accent);
        border: 1px solid #0e7490;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Random HTML Page</h1>
      <p>
        This page was generated on the fly. It does not do much, but it looks
        decent and is ready to be extended.
      </p>
      <span class="badge">Seed: 42</span>
    </main>
  </body>
</html>
